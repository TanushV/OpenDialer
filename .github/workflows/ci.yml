name: Verify OpenDialer
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The uv installer download has returned 504s; PyPI is the fallback for the same pinned version.
      - uses: astral-sh/setup-uv@v6
        id: uv
        continue-on-error: true
        with:
          version: '0.10.12'
      - if: steps.uv.outcome == 'failure'
        run: pipx install uv==0.10.12
      - run: uv sync --frozen --python 3.12
      - run: uv run python scripts/check.py run lint rules
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The uv installer download has returned 504s; PyPI is the fallback for the same pinned version.
      - uses: astral-sh/setup-uv@v6
        id: uv
        continue-on-error: true
        with:
          version: '0.10.12'
      - if: steps.uv.outcome == 'failure'
        run: pipx install uv==0.10.12
      - run: uv sync --frozen --python 3.12
      - run: uv run python scripts/check.py run backend
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/desktop
      - run: python3 scripts/check.py run types format frontend edge
  browser-mac:
    # The app runs WebKit on macOS (R1.2): the same engine, OS and window sizes as the rep's Mac.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # The uv installer download has returned 504s; PyPI is the fallback for the same pinned version.
      - uses: astral-sh/setup-uv@v6
        id: uv
        continue-on-error: true
        with:
          version: '0.10.12'
      - if: steps.uv.outcome == 'failure'
        run: pipx install uv==0.10.12
      - run: uv sync --frozen --python 3.12
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci && npx playwright install webkit
        working-directory: apps/desktop
      - run: python3 scripts/check.py run browser
        env:
          PW_WORKERS: '2'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-mac-failure-traces
          path: apps/desktop/test-results
  browser-chromium:
    # R9D.3: Windows runs the app in WebView2, which is Chromium; the same suite and layout audit run there too.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The uv installer download has returned 504s; PyPI is the fallback for the same pinned version.
      - uses: astral-sh/setup-uv@v6
        id: uv
        continue-on-error: true
        with:
          version: '0.10.12'
      - if: steps.uv.outcome == 'failure'
        run: pipx install uv==0.10.12
      - run: uv sync --frozen --python 3.12
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: apps/desktop
      - run: python3 scripts/check.py run browser
        env:
          PW_WORKERS: '2'
          PW_BROWSER: chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-chromium-failure-traces
          path: apps/desktop/test-results
  desktop-shell:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # The uv installer download has returned 504s; PyPI is the fallback for the same pinned version.
      - uses: astral-sh/setup-uv@v6
        id: uv
        continue-on-error: true
        with:
          version: '0.10.12'
      - if: steps.uv.outcome == 'failure'
        run: pipx install uv==0.10.12
      - run: uv sync --frozen --python 3.12
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci && npm run build
        working-directory: apps/desktop
      - uses: dtolnay/rust-toolchain@stable
      - run: uv run python scripts/build_sidecar.py
      # The frozen backend must load search and start (the trainer was archived with StatML, D31).
      - run: uv run python scripts/check.py run sidecars
      - run: uv run pytest services/backend/tests/test_codex_native.py services/backend/tests/test_secret_storage.py tests/test_package_macos.py -q
        env:
          OPENDIALER_TEST_CODEX_NATIVE: '1'
      - run: python3 scripts/check.py run rust
  windows:
    # R9D.1: the same backend, frozen sidecars and desktop shell on Windows, which a rep's seat can run (D2).
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      # The uv installer download has returned 504s; PyPI is the fallback for the same pinned version.
      - uses: astral-sh/setup-uv@v6
        id: uv
        continue-on-error: true
        with:
          version: '0.10.12'
      - if: steps.uv.outcome == 'failure'
        run: pipx install uv==0.10.12
      - run: uv sync --frozen --python 3.12
      - run: uv run python scripts/check.py run backend
        env:
          PYTHONUTF8: '1'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci && npm run build
        working-directory: apps/desktop
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: uv run python scripts/build_sidecar.py
      - run: uv run python scripts/check.py run sidecars rust

