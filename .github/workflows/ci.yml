name: Verify OpenDialer
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: disposable_ci_test
          POSTGRES_DB: opendialer_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d opendialer_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.12'
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check services/backend/app services/backend/tests tests scripts deploy/backup
      - run: uv run ruff format --check services/backend/app services/backend/tests tests scripts deploy/backup
      - run: mkdir -p work/remediation/completion
      - run: uv run pytest services/backend/tests tests -q --cov=app --cov-branch --cov-report=json:work/remediation/completion/sqlite-coverage.json --junitxml=work/remediation/completion/sqlite-junit.xml
      - run: uv run pytest services/backend/tests tests -q --cov=app --cov-branch --cov-report=json:work/remediation/completion/postgres-coverage.json --junitxml=work/remediation/completion/postgres-junit.xml
        env:
          OPENDIALER_TEST_POSTGRES_URL: postgresql+psycopg://postgres:disposable_ci_test@localhost:5432/opendialer_test
      - run: uv run python scripts/check_completion_coverage.py --statements 90 --branches 80 work/remediation/completion/sqlite-coverage.json work/remediation/completion/postgres-coverage.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: software-acceptance-receipts
          path: |
            work/remediation/completion/*-coverage.json
            work/remediation/completion/*-junit.xml
      - run: uv run pip-audit --disable-pip --no-deps -r <(uv export --frozen --no-dev --no-hashes --no-emit-project)
        shell: bash
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/desktop
      - run: npm run typecheck && npm run format:check && npm run build && npm test && npm audit --audit-level=moderate
        working-directory: apps/desktop
      - run: npx playwright install --with-deps chromium
        working-directory: apps/desktop
      - name: Create isolated connected browser database
        run: |
          uv run python - <<'PY'
          import psycopg
          from scripts.disposable_database import validate_database_url
          target = 'postgresql+psycopg://postgres:disposable_ci_test@localhost:5432/opendialer_completion_e2e'
          validate_database_url(target, purpose='browser')
          with psycopg.connect('postgresql://postgres:disposable_ci_test@localhost:5432/opendialer_test', autocommit=True) as connection:
              connection.execute('CREATE DATABASE opendialer_completion_e2e')
          PY
      - run: npm run test:e2e
        working-directory: apps/desktop
        env:
          OPENDIALER_E2E_DATABASE_URL: postgresql+psycopg://postgres:disposable_ci_test@localhost:5432/opendialer_completion_e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-traces
          path: apps/desktop/test-results
  native:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.12'
      - run: uv sync --frozen --python 3.12
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci && npm run build
        working-directory: apps/desktop
      - uses: dtolnay/rust-toolchain@stable
      - run: uv run python scripts/build_sidecar.py
      - run: cargo fmt --check && cargo test --locked
        working-directory: apps/desktop/src-tauri
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: apps/desktop/src-tauri
