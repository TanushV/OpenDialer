name: Verify OpenDialer
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.12'
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check services/backend tests scripts deploy/backup
      - run: uv run ruff format --check services/backend tests scripts deploy/backup
  backend:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: disposable_ci_test
          POSTGRES_DB: opendialer_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d opendialer_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      OPENDIALER_TEST_POSTGRES_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://postgres:disposable_ci_test@localhost:5432/opendialer_test' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.12'
      - run: uv sync --frozen --python 3.12
      - run: uv run pytest services/backend/tests tests -q -n auto
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci && npm run typecheck && npm run format:check && npm run build && npm test
        working-directory: apps/desktop
  e2e:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: disposable_ci_test
          POSTGRES_DB: opendialer_completion_e2e
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d opendialer_completion_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.12'
      - run: uv sync --frozen --python 3.12
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: apps/desktop
      - run: npm run test:e2e
        working-directory: apps/desktop
        env:
          OPENDIALER_E2E_DATABASE_URL: postgresql+psycopg://postgres:disposable_ci_test@localhost:5432/opendialer_completion_e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-traces
          path: apps/desktop/test-results
  desktop-shell:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.12'
      - run: uv sync --frozen --python 3.12
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci && npm run build
        working-directory: apps/desktop
      - uses: dtolnay/rust-toolchain@stable
      - run: uv run python scripts/build_sidecar.py
      - run: uv run pytest services/backend/tests/test_codex_native.py tests/test_package_macos.py -q
        env:
          OPENDIALER_TEST_CODEX_NATIVE: '1'
      - run: cargo fmt --check && cargo test --locked && cargo clippy --locked --all-targets -- -D warnings
        working-directory: apps/desktop/src-tauri
