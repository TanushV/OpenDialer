name: Verify OpenDialer
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: disposable_ci_test
          POSTGRES_DB: opendialer_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d opendialer_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.12'
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check services/backend/app services/backend/tests tests scripts deploy/backup
      - run: uv run pytest --cov=app --cov-report=xml -q
      - run: uv run pytest services/backend/tests -q
        env:
          OPENDIALER_TEST_POSTGRES_URL: postgresql+psycopg://postgres:disposable_ci_test@localhost:5432/opendialer_test
      - run: uv run pip-audit --disable-pip --no-deps -r <(uv export --frozen --no-dev --no-hashes --no-emit-project)
        shell: bash
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/desktop
      - run: npm run build && npm test && npm audit --audit-level=moderate
        working-directory: apps/desktop
      - run: npx playwright install --with-deps chromium
        working-directory: apps/desktop
      - run: npm run test:e2e
        working-directory: apps/desktop
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-traces
          path: apps/desktop/test-results
  native:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.12'
      - run: uv sync --frozen --python 3.12
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci && npm run build
        working-directory: apps/desktop
      - uses: dtolnay/rust-toolchain@stable
      - run: uv run python scripts/build_sidecar.py
      - run: cargo fmt --check && cargo test --locked
        working-directory: apps/desktop/src-tauri
