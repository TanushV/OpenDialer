name: Signed desktop release
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: desktop-release
  cancel-in-progress: false
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.12'
      - run: uv sync --frozen --python 3.12
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci && npm run build && npm test
        working-directory: apps/desktop
      - run: uv run pytest tests/test_distribution_contract.py services/backend/tests/test_secret_storage.py -q
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          PYTHONUTF8: '1'
      - name: Freeze the authority and trainer sidecars
        run: uv run python scripts/build_sidecar.py
      - name: Finish and verify scoped macOS signing
        if: runner.os == 'macOS'
        run: uv run python scripts/package_macos.py --build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Build Windows installers
        if: runner.os == 'Windows'
        run: npm run tauri build -- --bundles nsis,msi
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/macos/*.tar.gz*
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe*
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi*
  draft:
    needs: desktop
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: work/release-input
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/release_manifest.py --artifacts work/release-input --output work/release-publish
      - name: Create reviewable release with both platforms
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(python -c 'import json; print(json.load(open("apps/desktop/src-tauri/tauri.conf.json"))["version"])')
          gh release create "v$version" work/release-publish/* --target "$GITHUB_SHA" --draft --title "OpenDialer $version" --notes-file docs/RELEASE_NOTES.md
