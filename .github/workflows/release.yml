name: Signed desktop release
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: desktop-release
  cancel-in-progress: false
jobs:
  verified:
    # D21: a signed build only ever comes from a commit whose Verify run passed.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/release_gate.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
  desktop:
    needs: verified
    # Every desktop package comes from the same verified commit (D2).
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      # The uv installer download has returned 504s; PyPI is the fallback for the same pinned version.
      - uses: astral-sh/setup-uv@v6
        id: uv
        continue-on-error: true
        with:
          version: '0.10.12'
      - if: steps.uv.outcome == 'failure'
        run: pipx install uv==0.10.12
      - run: uv sync --frozen --python 3.12
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci && npm run build && npm test
        working-directory: apps/desktop
      - run: uv run pytest tests/test_distribution_contract.py services/backend/tests/test_secret_storage.py -q
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          PYTHONUTF8: '1'
      - name: Freeze the authority sidecar
        run: uv run python scripts/build_sidecar.py
      - name: Finish and verify scoped macOS signing
        if: runner.os == 'macOS'
        run: uv run python scripts/package_macos.py --build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # R9D.4: Windows installers carry the updater signature. Authenticode signing (Azure Trusted Signing or an OV
      # certificate) is added through WINDOWS_SIGN_COMMAND once the owner chooses the route; until then the build says so.
      - name: Build the Windows installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:WINDOWS_SIGN_COMMAND) {
            $config = @{ bundle = @{ windows = @{ signCommand = $env:WINDOWS_SIGN_COMMAND } } } | ConvertTo-Json -Depth 5 -Compress
            npm run tauri build -- --bundles nsis,msi --config $config
          } else {
            Write-Output "::warning::Windows installers are not Authenticode-signed yet; SmartScreen will warn until R9D.4 is set up."
            npm run tauri build -- --bundles nsis,msi
          }
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WINDOWS_SIGN_COMMAND: ${{ secrets.WINDOWS_SIGN_COMMAND }}
      - name: Build and sign the Linux package
        if: runner.os == 'Linux'
        working-directory: apps/desktop
        run: |
          npm run tauri build -- --ci --bundles deb --config '{"bundle":{"createUpdaterArtifacts":false}}'
          version=$(node -p 'require("./src-tauri/tauri.conf.json").version')
          npm run tauri signer sign -- --app-version "$version" src-tauri/target/release/bundle/deb/*_amd64.deb
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/macos/*.tar.gz*
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe*
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi*
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb*
  draft:
    needs: desktop
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: work/release-input
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/release_manifest.py --artifacts work/release-input --output work/release-publish
      - name: Create a reviewable draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(python -c 'import json; print(json.load(open("apps/desktop/src-tauri/tauri.conf.json"))["version"])')
          gh release create "v$version" work/release-publish/* --target "$GITHUB_SHA" --draft --title "OpenDialer $version" --notes-file docs/RELEASE_NOTES.md
