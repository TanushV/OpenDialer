name: Verify existing Windows installer
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Windows installer workflow run containing the exact packages to test
        required: true
        type: string
      expected_build_sha:
        description: Exact reviewed source commit used to build those packages
        required: true
        type: string
      baseline_version:
        description: Optional published baseline to update through the signed in-app updater
        required: false
        default: ''
        type: string
permissions:
  contents: read
  actions: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        installer: [nsis, msi]
    runs-on: windows-2022
    timeout-minutes: 75
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Verify installer provenance
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.build_run_id }}
          EXPECTED_SHA: ${{ inputs.expected_build_sha }}
        run: |
          if ($env:BUILD_RUN -notmatch '^\d+$' -or $env:EXPECTED_SHA -notmatch '^[0-9a-f]{40}$') { throw 'Invalid immutable build identity' }
          $run = gh api "repos/${{ github.repository }}/actions/runs/$env:BUILD_RUN" | ConvertFrom-Json
          if ($run.head_sha -ne $env:EXPECTED_SHA -or $run.path -ne '.github/workflows/windows.yml') { throw 'Installer provenance mismatch' }
          Write-Host "Testing installers from $($run.head_sha), run $env:BUILD_RUN"
      - uses: actions/download-artifact@v4
        with:
          name: windows-installers-and-native-evidence
          path: work/reused-installer
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.12'
      - run: uv sync --frozen --python 3.12
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          cache-on-failure: true
      - name: Install the unchanged package on a fresh runner
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_VERSION: ${{ inputs.baseline_version }}
          INSTALLER_KIND: ${{ matrix.installer }}
        run: |
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $pattern = if ($env:INSTALLER_KIND -eq 'msi') { "OpenDialer_${version}_x64_*.msi" } else { "OpenDialer_${version}_x64-setup.exe" }
          $packages = @(Get-ChildItem work/reused-installer -Recurse -Filter $pattern)
          if ($packages.Count -ne 1) { throw 'Expected exactly one version-matched installer' }
          $candidate = $packages[0]
          "OPENDIALER_INSTALLER_KIND=$env:INSTALLER_KIND" >> $env:GITHUB_ENV
          "OPENDIALER_EXPECTED_INSTALLER_NAME=$($candidate.Name)" >> $env:GITHUB_ENV
          "OPENDIALER_EXPECTED_INSTALLER_SHA256=$((Get-FileHash $candidate.FullName -Algorithm SHA256).Hash.ToLower())" >> $env:GITHUB_ENV
          "OPENDIALER_EXPECTED_SIGNATURE_FILE=$($candidate.FullName).sig" >> $env:GITHUB_ENV
          $unpack = Join-Path $env:RUNNER_TEMP candidate-installer-bytes
          if ($env:INSTALLER_KIND -eq 'msi') {
            $extracted = Start-Process msiexec.exe -ArgumentList '/a', "`"$($candidate.FullName)`"", '/qn', "TARGETDIR=`"$unpack`"" -Wait -PassThru
            if ($extracted.ExitCode -ne 0) { throw 'Could not extract the MSI administrative image' }
          } else {
            & 7z x $candidate.FullName "-o$unpack" -y | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Could not inspect the unchanged NSIS package' }
          }
          $backend = @(Get-ChildItem $unpack -Recurse -Filter opendialer-backend.exe)
          if ($backend.Count -ne 1) { throw 'Expected one packaged backend executable' }
          $backendHash = (Get-FileHash $backend[0].FullName -Algorithm SHA256).Hash.ToLower()
          "OPENDIALER_EXPECTED_BACKEND_SHA256=$backendHash" >> $env:GITHUB_ENV
          $selectedVersion = $version
          $packageDirectory = 'work/reused-installer'
          if ($env:BASELINE_VERSION) {
            if ($env:BASELINE_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid baseline version' }
            New-Item -ItemType Directory -Force work/baseline-installer | Out-Null
            $pattern = if ($env:INSTALLER_KIND -eq 'msi') { "OpenDialer_$($env:BASELINE_VERSION)_x64_*.msi" } else { "OpenDialer_$($env:BASELINE_VERSION)_x64-setup.exe" }
            gh release download "v$env:BASELINE_VERSION" --repo "${{ github.repository }}" --dir work/baseline-installer --pattern $pattern --pattern SHA256SUMS.txt
            if ($LASTEXITCODE -ne 0) { throw 'Could not download the published baseline' }
            $packages = @(Get-ChildItem work/baseline-installer -Filter $pattern)
            if ($packages.Count -ne 1) { throw 'Expected exactly one unchanged baseline package' }
            $actual = (Get-FileHash $packages[0].FullName -Algorithm SHA256).Hash.ToLower()
            $expected = @(Get-Content work/baseline-installer/SHA256SUMS.txt | Where-Object { $_.EndsWith('  ' + $packages[0].Name) })
            if ($expected.Count -ne 1 -or -not $expected[0].StartsWith($actual + '  ')) { throw 'Baseline checksum differs from the published release' }
            "OPENDIALER_UPDATE_TO_VERSION=$version" >> $env:GITHUB_ENV
            $selectedVersion = $env:BASELINE_VERSION
            $packageDirectory = 'work/baseline-installer'
          }
          $pattern = if ($env:INSTALLER_KIND -eq 'msi') { "OpenDialer_${selectedVersion}_x64_*.msi" } else { "OpenDialer_${selectedVersion}_x64-setup.exe" }
          $packages = @(Get-ChildItem $packageDirectory -Recurse -Filter $pattern)
          if ($packages.Count -ne 1) { throw 'Expected exactly one selected package' }
          $destination = Join-Path $env:RUNNER_TEMP OpenDialer
          if ($env:INSTALLER_KIND -eq 'msi') {
            $installed = Start-Process msiexec.exe -ArgumentList '/i', "`"$($packages[0].FullName)`"", '/qn', '/norestart', "INSTALLDIR=`"$destination`"" -Wait -PassThru
          } else {
            $installed = Start-Process $packages[0].FullName -ArgumentList '/S', "/D=$destination" -Wait -PassThru
          }
          if ($installed.ExitCode -notin @(0,3010)) { throw "Install failed: $($installed.ExitCode)" }
          $application = Get-ChildItem $destination -Filter *.exe | Where-Object { $_.Name -in @('opendialer-desktop.exe','OpenDialer.exe') } | Select-Object -First 1
          if (-not $application) { throw 'Installed application is missing' }
          "OPENDIALER_TEST_APPLICATION=$($application.FullName)" >> $env:GITHUB_ENV
      - name: Match the installed WebView2 runtime
        shell: pwsh
        run: |
          $roots = @("${env:ProgramFiles(x86)}\Microsoft\EdgeWebView\Application", "$env:ProgramFiles\Microsoft\EdgeWebView\Application", "$env:LOCALAPPDATA\Microsoft\EdgeWebView\Application")
          $runtime = $roots | Where-Object { Test-Path $_ } | ForEach-Object { Get-ChildItem $_ -Directory } | Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if (-not $runtime) { throw 'WebView2 runtime is missing' }
          $archive = Join-Path $env:RUNNER_TEMP edgedriver.zip
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$($runtime.Name)/edgedriver_win64.zip" -OutFile $archive
          $directory = Join-Path $env:RUNNER_TEMP edgedriver
          Expand-Archive $archive $directory
          "OPENDIALER_EDGE_DRIVER=$directory\msedgedriver.exe" >> $env:GITHUB_ENV
      - run: cargo install tauri-driver --locked
      - name: Prepare the isolated connected PostgreSQL authority
        shell: pwsh
        run: |
          Start-Service postgresql-x64-14
          $env:PGPASSWORD = 'root'
          & "$env:PGBIN/psql.exe" -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "ALTER USER postgres PASSWORD 'disposable_ci_test';"
          if ($LASTEXITCODE -ne 0) { throw 'Disposable PostgreSQL setup failed' }
          $env:PGPASSWORD = 'disposable_ci_test'
          & "$env:PGBIN/createdb.exe" -h 127.0.0.1 -U postgres opendialer_completion_e2e
          if ($LASTEXITCODE -ne 0) { throw 'Disposable browser database creation failed' }
          'OPENDIALER_E2E_DATABASE_URL=postgresql+psycopg://postgres:disposable_ci_test@127.0.0.1:5432/opendialer_completion_e2e' >> $env:GITHUB_ENV
      - name: Await the matching published update for baseline continuity
        if: inputs.baseline_version != ''
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $ready = $false
          for ($attempt = 0; $attempt -lt 90; $attempt++) {
            try {
              $manifest = Invoke-RestMethod 'https://github.com/TanushV/OpenDialer/releases/latest/download/latest.json' -Headers @{'Cache-Control'='no-cache'}
              if ($manifest.version -eq $version) { $ready = $true; break }
            } catch { }
            Start-Sleep -Seconds 10
          }
          if (-not $ready) { throw 'Matching update has not been published; no native update claim is possible' }
          $manifest | ConvertTo-Json -Depth 10 | Set-Content work/reused-installer/published-latest.json
          uv run python -c "import json,os; from pathlib import Path; from scripts.native_update import check_installer_manifest; check_installer_manifest(json.loads(Path('work/reused-installer/published-latest.json').read_text(encoding='utf-8-sig')),os.environ['OPENDIALER_INSTALLER_KIND'],'$version',os.environ['OPENDIALER_EXPECTED_INSTALLER_NAME'],Path(os.environ['OPENDIALER_EXPECTED_SIGNATURE_FILE']).read_text())"
          if ($LASTEXITCODE -ne 0) { throw 'The exact installer format or signed artifact is absent from the public manifest' }
      - run: uv run python scripts/windows_native_smoke.py
      - name: Record installed executable and owned-process diagnostics
        if: always()
        shell: pwsh
        run: |
          if ($env:OPENDIALER_TEST_APPLICATION) {
            $directory = Split-Path $env:OPENDIALER_TEST_APPLICATION
            $files = @(Get-ChildItem $directory -File | ForEach-Object { @{name=$_.Name;length=$_.Length;sha256=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower();version=$_.VersionInfo.ProductVersion} })
            $processes = @(Get-CimInstance Win32_Process -Filter "Name='opendialer-backend.exe' OR Name='opendialer-desktop.exe'" | Select-Object Name,ExecutablePath,ProcessId,ParentProcessId)
            New-Item -ItemType Directory -Force work/windows-native | Out-Null
            @{installed_files=$files;owned_processes=$processes} | ConvertTo-Json -Depth 6 | Set-Content work/windows-native/installed-diagnostics.json
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-native-verification-${{ matrix.installer }}
          path: work/windows-native/*
