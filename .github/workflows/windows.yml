name: Windows installer and native acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-installer
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: uv sync --frozen --python 3.12
      - run: uv run pytest -q
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
      - run: npm ci
        working-directory: apps/desktop
      - run: npm run build && npm test
        working-directory: apps/desktop
      - run: uv run python scripts/build_sidecar.py
      - run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Build signed Windows installers
        run: npm run tauri build -- --bundles nsis,msi
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Install into a clean disposable runner
        shell: pwsh
        run: |
          $installer = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $destination = Join-Path $env:RUNNER_TEMP OpenDialer
          $installed = Start-Process $installer.FullName -ArgumentList "/S", "/D=$destination" -Wait -PassThru
          if ($installed.ExitCode -ne 0) { throw "NSIS install failed: $($installed.ExitCode)" }
          $application = Get-ChildItem $destination -Filter *.exe | Where-Object { $_.Name -in @('opendialer-desktop.exe','OpenDialer.exe') } | Select-Object -First 1
          if (-not $application) { throw 'Installed application is missing' }
          "OPENDIALER_TEST_APPLICATION=$($application.FullName)" >> $env:GITHUB_ENV
      - name: Match the official Edge WebDriver
        shell: pwsh
        run: |
          $edge = Get-Item "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          $version = $edge.VersionInfo.FileVersion
          $archive = Join-Path $env:RUNNER_TEMP edgedriver.zip
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile $archive
          $directory = Join-Path $env:RUNNER_TEMP edgedriver
          Expand-Archive $archive $directory
          "OPENDIALER_EDGE_DRIVER=$directory\msedgedriver.exe" >> $env:GITHUB_ENV
      - run: cargo install tauri-driver --locked
      - name: Exercise installed native app and restart
        run: uv run python scripts/windows_native_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installers-and-native-evidence
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*
            apps/desktop/src-tauri/target/release/bundle/msi/*
            work/windows-native/*
