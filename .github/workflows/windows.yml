name: Windows installer and native acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-installer
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          cache-on-failure: true
      - run: uv sync --frozen --python 3.12
      - run: pwsh -File scripts/test_windows_update_scope.ps1
      - run: uv run pytest tests/test_distribution_contract.py tests/test_native_update_wait.py tests/test_frozen_acceptance.py tests/test_windows_native_contract.py -q
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
      - run: npm ci
        working-directory: apps/desktop
      - run: npm run build && npm test
        working-directory: apps/desktop
      - run: uv run python scripts/build_sidecar.py
      - name: Exercise the packaged authority without developer runtimes
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $env:OPENDIALER_TEST_BINARY = (Resolve-Path apps/desktop/src-tauri/binaries/opendialer-backend-x86_64-pc-windows-msvc.exe).Path
          uv run python scripts/frozen_acceptance.py --expected-version $version --output work/windows-native/frozen-runtime.json
          if ($LASTEXITCODE -ne 0) { throw 'Frozen runtime acceptance failed' }
      - run: cargo test --release --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Build signed Windows installers
        run: npm run tauri build -- --bundles nsis,msi
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Install into a clean disposable runner
        shell: pwsh
        run: |
          $installer = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $destination = Join-Path $env:RUNNER_TEMP OpenDialer
          $installed = Start-Process $installer.FullName -ArgumentList "/S", "/D=$destination" -Wait -PassThru
          if ($installed.ExitCode -ne 0) { throw "NSIS install failed: $($installed.ExitCode)" }
          $application = Get-ChildItem $destination -Filter *.exe | Where-Object { $_.Name -in @('opendialer-desktop.exe','OpenDialer.exe') } | Select-Object -First 1
          if (-not $application) { throw 'Installed application is missing' }
          "OPENDIALER_TEST_APPLICATION=$($application.FullName)" >> $env:GITHUB_ENV
      - name: Match the official Edge WebDriver
        shell: pwsh
        run: |
          $roots = @("${env:ProgramFiles(x86)}\Microsoft\EdgeWebView\Application", "$env:ProgramFiles\Microsoft\EdgeWebView\Application", "$env:LOCALAPPDATA\Microsoft\EdgeWebView\Application")
          $runtime = $roots | Where-Object { Test-Path $_ } | ForEach-Object { Get-ChildItem $_ -Directory } | Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if (-not $runtime) { throw 'Installed WebView2 runtime was not found' }
          $version = $runtime.Name
          Write-Host "Testing the installed WebView2 runtime $version"
          $archive = Join-Path $env:RUNNER_TEMP edgedriver.zip
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile $archive
          $directory = Join-Path $env:RUNNER_TEMP edgedriver
          Expand-Archive $archive $directory
          "OPENDIALER_EDGE_DRIVER=$directory\msedgedriver.exe" >> $env:GITHUB_ENV
      - run: cargo install tauri-driver --locked
      - name: Prepare the isolated connected PostgreSQL authority
        shell: pwsh
        run: |
          Start-Service postgresql-x64-14
          $env:PGPASSWORD = 'root'
          & "$env:PGBIN/psql.exe" -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "ALTER USER postgres PASSWORD 'disposable_ci_test';"
          if ($LASTEXITCODE -ne 0) { throw 'Disposable PostgreSQL setup failed' }
          $env:PGPASSWORD = 'disposable_ci_test'
          & "$env:PGBIN/createdb.exe" -h 127.0.0.1 -U postgres opendialer_completion_e2e
          if ($LASTEXITCODE -ne 0) { throw 'Disposable browser database creation failed' }
          'OPENDIALER_E2E_DATABASE_URL=postgresql+psycopg://postgres:disposable_ci_test@127.0.0.1:5432/opendialer_completion_e2e' >> $env:GITHUB_ENV
      - name: Exercise installed native app and restart
        run: uv run python scripts/windows_native_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installers-and-native-evidence
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*
            apps/desktop/src-tauri/target/release/bundle/msi/*
            work/windows-native/*
