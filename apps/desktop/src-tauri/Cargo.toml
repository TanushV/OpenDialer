[package]
name = "opendialer-desktop"
version = "0.6.0"
description = "OpenDialer desktop"
authors = ["OpenDialer contributors"]
edition = "2021"
license = "Apache-2.0"
[lib]
name = "opendialer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
# Updates use signed EXE/MSI on Windows and the native tar.gz bundle on macOS.
# Do not compile the unused Windows ZIP compatibility extractor.
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
url = "2"
# Already locked through tauri-plugin-shell; used only to terminate the owned SSH process group.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tokio = { version = "1", features = ["macros", "rt", "time"] }
