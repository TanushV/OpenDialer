[project]
name = "opendialer"
version = "0.7.0"
description = "Local-first Tauri sales dialer with an authenticated shared authority"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.135,<1",
  "uvicorn[standard]>=0.41,<1",
  "sqlalchemy>=2.0.48,<3",
  "psycopg[binary]>=3.3,<4",
  "pydantic-settings>=2.13,<3",
  "httpx>=0.28,<1",
  "phonenumbers>=9,<10",
  "cryptography>=50,<51",
  "PyJWT>=2.12,<3",
  "pwdlib[argon2]>=0.3,<1",
  "threadpoolctl>=3.6,<4",
  "numpy>=2.2,<3",
  "scikit-learn>=1.7,<2",
  "beautifulsoup4>=4.14,<5",
  "tzdata>=2026.1,<2027",
  "supabase==2.33.0",
]
[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-asyncio>=1.3,<2",
    "pytest-xdist>=3.8,<4",
    "ruff>=0.15,<1",
    "pyinstaller>=6.19,<7",
    "setuptools>=84.1.0",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["services/backend/app"]
[tool.pytest.ini_options]
testpaths = ["services/backend/tests", "tests"]
pythonpath = ["services/backend", "."]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
  "postgres: PostgreSQL-specific behavior (row locks, concurrent writers); requires OPENDIALER_TEST_POSTGRES_URL",
  "sqlite_only: SQLite-specific oracle; skipped when OPENDIALER_TEST_POSTGRES_URL is set",
  "database: database, migration, row-lock or disposable-store behavior on the configured store; part of the push PostgreSQL subset",
  "live: explicit permissioned provider test",
]
[tool.ruff]
line-length = 110
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["E501", "S101", "B008"]
[tool.ruff.lint.isort]
# Test helpers named conftest are imported from services/backend/tests, not the root fixture.
known-third-party = ["conftest"]
[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106", "S311"]
"tests/**" = ["S105", "S106", "S311"]
"scripts/e2e_server.py" = ["S105", "S106"]
