[project]
name = "opendialer"
version = "2.0.0"
description = "Single-user Mac sales dialer with a local SQLite authority"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.135,<1",
  "uvicorn[standard]>=0.41,<1",
  "sqlalchemy>=2.0.48,<3",
  "pydantic-settings>=2.13,<3",
  "httpx>=0.28,<1",
  "phonenumbers>=9,<10",
  "cryptography>=50,<51",
  "threadpoolctl>=3.6,<4",
  "numpy>=2.2,<3",
  "scikit-learn>=1.7,<2",
  "beautifulsoup4>=4.14,<5",
  "tzdata>=2026.1,<2027",
  "supabase==2.33.0",
  "ddgs>=9,<10",
]
[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-asyncio>=1.3,<2",
    "pytest-xdist>=3.8,<4",
    "ruff>=0.15,<1",
    "pyinstaller>=6.19,<7",
    "setuptools>=84.1.0",
    "pgserver>=0.1.4",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["services/backend/app"]
[tool.pytest.ini_options]
testpaths = ["services/backend/tests", "tests"]
pythonpath = ["services/backend", "."]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
  "database: database, migration or row-lock behavior on the SQLite store",
  "live: explicit permissioned provider test",
  "slow: takes over a second locally; left out of the fast tier of scripts/check.py",
]
[tool.ruff]
line-length = 110
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["E501", "S101", "B008"]
[tool.ruff.lint.isort]
# Test helpers named conftest are imported from services/backend/tests, not the root fixture.
known-third-party = ["conftest"]
[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106", "S311", "S608"]
"tests/**" = ["S105", "S106", "S311"]
"scripts/e2e_server.py" = ["S105", "S106"]
